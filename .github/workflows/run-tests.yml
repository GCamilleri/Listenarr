name: Run Tests

on:
  push:
    # Every branch. The previous list covered beta, main, canary and feature/*,
    # which missed the branch names CONTRIBUTING and CLAUDE.md actually tell
    # people to use (123-audible-integration, bugfix/search-results,
    # fix/..., integration/...), so push CI silently did not run on them.
    branches: [ '**' ]
  pull_request:
    branches: [ beta, main, canary ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: run-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    # The suite is known to deadlock on an unsupported filesystem. Without a
    # timeout a hang burns the six-hour GitHub default.
    timeout-minutes: 45
    permissions:
      contents: read
      # dorny/test-reporter publishes the .trx as a check run.
      checks: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      API_PROJECT: listenarr.api/Listenarr.Api.csproj
      LISTENARR_REQUIRED_NATIVE_TEST_CAPABILITIES: 'DirectorySymbolicLinks,FileSymbolicLinks'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Restore
        run: dotnet restore listenarr.slnx

      - name: Backend format check
        run: npm run --silent format:backend:check

      - name: Enforce layering rules
        run: |
          set -e
          VIOLATIONS=0

          echo "Checking for layering violations (api -> infrastructure)..."
          if git grep -n --no-color "listenarr.infrastructure" -- "listenarr.api/**/*.cs" ":(exclude)listenarr.api/Program.cs" || git grep -n --no-color "Listenarr.Infrastructure" -- "listenarr.api/**/*.cs" ":(exclude)listenarr.api/Program.cs"; then
            echo "Layering violation: listenarr.api references listenarr.infrastructure." >&2
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "Checking for layering violations (application -> infrastructure)..."
          if git grep -n --no-color "listenarr.infrastructure" -- "listenarr.application/**/*.cs" || git grep -n --no-color "Listenarr.Infrastructure" -- "listenarr.application/**/*.cs"; then
            echo "Layering violation: listenarr.application references listenarr.infrastructure." >&2
            echo "Define contracts in listenarr.application and implement them in listenarr.infrastructure." >&2
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          echo "Checking for async void in production code..."
          if git grep -n --no-color "async void" -- "listenarr.api/**/*.cs" "listenarr.application/**/*.cs" "listenarr.infrastructure/**/*.cs" "listenarr.domain/**/*.cs"; then
            echo "async void found in production code — use async Task instead to avoid swallowed exceptions." >&2
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "$VIOLATIONS enforcement check(s) failed." >&2
            exit 1
          fi
          echo "All enforcement checks passed."

      - name: Install frontend deps
        working-directory: fe
        run: npm ci

      - name: Build frontend
        working-directory: fe
        run: npm run build --if-present

      - name: Repository path safety
        run: npm run --silent validate:repository-paths

      - name: Repository path-safety tests
        run: npm run --silent test:repository-paths

      - name: Frontend lint
        run: npm run --silent lint:frontend

      - name: Frontend type check
        working-directory: fe
        run: |
          if npm run type-check --silent --if-present; then
            echo "Frontend type check passed (or no type-check script present)."
          else
            echo "Frontend type check failed." >&2
            exit 1
          fi

      - name: Build solution
        run: dotnet build listenarr.slnx --no-restore --configuration Release

      - name: Run native backend tests
        env:
          ASPNETCORE_ENVIRONMENT: Test
        shell: bash
        run: scripts/run-native-backend-tests.sh --results-directory "${{ github.workspace }}/artifacts/test-results" --coverage

      - name: Run frontend tests
        working-directory: fe
        run: npm run test:unit

      - name: Publish test results
        # Runs even when the suite failed; that is the case where the report
        # matters most.
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend tests
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Coverage summary
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: artifacts/test-results/**/coverage.cobertura.xml
          targetdir: artifacts/coverage-report
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'

      - name: Append coverage to the job summary
        if: ${{ !cancelled() }}
        run: cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            artifacts/test-results
            artifacts/coverage-report
          retention-days: 14

      - name: Publish API (linux-x64)
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -r linux-x64 --no-restore --self-contained true /p:PublishSingleFile=true -o listenarr.api/publish/linux-x64

  backend-tests-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      LISTENARR_REQUIRED_NATIVE_TEST_CAPABILITIES: 'DirectorySymbolicLinks,FileSymbolicLinks'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore listenarr.slnx

      - name: Build backend
        run: dotnet build listenarr.slnx --no-restore --configuration Release

      - name: Run native backend tests
        env:
          ASPNETCORE_ENVIRONMENT: Test
        # Git Bash on the Windows runner. The read-only bind-mount block is
        # Linux-only and skipped here, same as the PowerShell version was.
        shell: bash
        run: scripts/run-native-backend-tests.sh --results-directory "${{ github.workspace }}/artifacts/test-results"

      - name: Upload Windows test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-windows
          path: artifacts/test-results
          retention-days: 14
